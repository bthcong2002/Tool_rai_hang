name: Keep Streamlit App Awake
on:
  schedule:
    - cron: "0 */4 * * *" # Chạy mỗi 4 tiếng, bạn có thể chỉnh lại
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Cài đặt Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Mở trang bằng trình duyệt ảo
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://toolraihang-lcf59pcasbszau4qgkueyd.streamlit.app', wait_until='networkidle')
              print('Đã mô phỏng truy cập thành công')
              browser.close()
          "
